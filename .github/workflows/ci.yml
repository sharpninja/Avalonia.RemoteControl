name: CI

on:
  pull_request:
  push:
    branches:
      - master
      - main
    tags:
      - v*

jobs:
  build-test-pack:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore .NET workloads
        run: dotnet workload restore Avalonia.RemoteControl.slnx

      - name: Restore
        run: dotnet restore Avalonia.RemoteControl.slnx

      - name: Build
        run: dotnet build Avalonia.RemoteControl.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test Avalonia.RemoteControl.slnx --configuration Release --no-build --logger trx

      - name: Pack
        run: dotnet pack Avalonia.RemoteControl.slnx --configuration Release --no-build --output artifacts/packages

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: artifacts/packages/*

      - name: Publish tagged packages
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:NUGET_API_KEY)) {
            Write-Host "NUGET_API_KEY is not configured; skipping publish."
            exit 0
          }
          Get-ChildItem artifacts/packages -Filter *.nupkg | ForEach-Object {
            dotnet nuget push $_.FullName --source https://api.nuget.org/v3/index.json --api-key $env:NUGET_API_KEY --skip-duplicate
          }
          Get-ChildItem artifacts/packages -Filter *.snupkg | ForEach-Object {
            dotnet nuget push $_.FullName --source https://api.nuget.org/v3/index.json --api-key $env:NUGET_API_KEY --skip-duplicate
          }
