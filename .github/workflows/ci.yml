name: CI

on:
  pull_request:
  push:
    branches:
      - master
      - main
    tags:
      - v*

jobs:
  build-test-pack:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore .NET workloads
        run: dotnet workload restore Avalonia.RemoteControl.slnx

      - name: Restore
        run: dotnet restore Avalonia.RemoteControl.slnx

      - name: Build
        run: dotnet build Avalonia.RemoteControl.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test Avalonia.RemoteControl.slnx --configuration Release --no-build --logger trx

      - name: Pack
        run: dotnet pack Avalonia.RemoteControl.slnx --configuration Release --no-build --output artifacts/packages

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: artifacts/packages/*

      - name: Publish tagged packages
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:NUGET_API_KEY)) {
            Write-Host "NUGET_API_KEY is not configured; skipping publish."
            exit 0
          }

          $tag = $env:GITHUB_REF -replace '^refs/tags/', ''
          if ($tag -notmatch '^v?\d+\.\d+\.\d+([.-][0-9A-Za-z][0-9A-Za-z.-]*)?$') {
            Write-Host "Tag '$tag' is not a version tag; skipping nuget.org publish."
            exit 0
          }

          if ($tag -match '-') {
            throw "Tag '$tag' is a prerelease tag. Full release publish requires a stable version tag like v1.2.3."
          }

          $expectedVersion = $tag -replace '^v', ''
          $packagePrefixes = @(
            'SharpNinja.Avalonia.RemoteControl.Protocol.',
            'SharpNinja.Avalonia.RemoteControl.Runtime.',
            'SharpNinja.Avalonia.RemoteControl.Server.',
            'SharpNinja.Avalonia.RemoteControl.Tool.'
          )

          $packages = Get-ChildItem artifacts/packages |
            Where-Object { $_.Extension -eq '.nupkg' } |
            Select-Object -ExpandProperty FullName
          foreach ($package in $packages) {
            $packageName = Split-Path -Leaf $package
            $baseName = [System.IO.Path]::GetFileNameWithoutExtension($packageName)
            $packageVersion = $null
            foreach ($prefix in $packagePrefixes) {
              if ($baseName.StartsWith($prefix, [System.StringComparison]::Ordinal)) {
                $packageVersion = $baseName.Substring($prefix.Length)
                break
              }
            }

            if ([string]::IsNullOrWhiteSpace($packageVersion)) {
              throw "Could not parse package version from $packageName."
            }

            if ($packageVersion -ne $expectedVersion) {
              throw "Version tag '$tag' produced $packageName version '$packageVersion'; expected '$expectedVersion'."
            }

            dotnet nuget push $package --source https://api.nuget.org/v3/index.json --api-key $env:NUGET_API_KEY --skip-duplicate
            if ($LASTEXITCODE -ne 0) {
              throw "dotnet nuget push failed for $package"
            }
          }
