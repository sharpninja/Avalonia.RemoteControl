name: CI

on:
  pull_request:
  push:
    branches:
      - master
      - main

jobs:
  build-test-pack:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Avalonia.RemoteControl.slnx

      - name: Build
        run: dotnet build Avalonia.RemoteControl.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test Avalonia.RemoteControl.slnx --configuration Release --no-build --logger trx

      - name: Pack
        run: dotnet pack Avalonia.RemoteControl.slnx --configuration Release --no-build --output artifacts/packages

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: artifacts/packages/*
