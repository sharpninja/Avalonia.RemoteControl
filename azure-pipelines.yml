trigger:
  branches:
    include:
      - master
      - main
  tags:
    include:
      - v*

pr:
  branches:
    include:
      - master
      - main

pool:
  vmImage: windows-latest

variables:
  BuildConfiguration: Release
  CI: true

steps:
  - task: UseDotNet@2
    displayName: Use .NET SDK
    inputs:
      packageType: sdk
      version: 10.0.x

  - script: dotnet restore Avalonia.RemoteControl.slnx
    displayName: Restore

  - script: dotnet build Avalonia.RemoteControl.slnx --configuration $(BuildConfiguration) --no-restore
    displayName: Build

  - script: dotnet test Avalonia.RemoteControl.slnx --configuration $(BuildConfiguration) --no-build --logger trx
    displayName: Test

  - script: dotnet pack Avalonia.RemoteControl.slnx --configuration $(BuildConfiguration) --no-build --output $(Build.ArtifactStagingDirectory)/packages
    displayName: Pack

  - task: PublishBuildArtifacts@1
    displayName: Publish package artifacts
    inputs:
      PathtoPublish: $(Build.ArtifactStagingDirectory)/packages
      ArtifactName: nuget-packages

  - pwsh: |
      Get-ChildItem "$(Build.ArtifactStagingDirectory)/packages" -Filter *.nupkg | ForEach-Object {
        dotnet nuget push $_.FullName --source https://api.nuget.org/v3/index.json --api-key "$(NuGetApiKey)" --skip-duplicate
      }
      Get-ChildItem "$(Build.ArtifactStagingDirectory)/packages" -Filter *.snupkg | ForEach-Object {
        dotnet nuget push $_.FullName --source https://api.nuget.org/v3/index.json --api-key "$(NuGetApiKey)" --skip-duplicate
      }
    displayName: Publish tagged packages
    condition: and(succeeded(), startsWith(variables['Build.SourceBranch'], 'refs/tags/v'), ne(variables['NuGetApiKey'], ''))
