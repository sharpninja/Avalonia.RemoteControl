trigger:
  branches:
    include:
      - master
      - main
  tags:
    include:
      - v*

pr:
  branches:
    include:
      - master
      - main

pool:
  vmImage: windows-latest

variables:
  BuildConfiguration: Release
  CI: true

steps:
  - task: UseDotNet@2
    displayName: Use .NET SDK
    inputs:
      packageType: sdk
      version: 10.0.x

  - script: dotnet workload restore Avalonia.RemoteControl.slnx
    displayName: Restore .NET workloads

  - script: dotnet restore Avalonia.RemoteControl.slnx
    displayName: Restore

  - script: dotnet build Avalonia.RemoteControl.slnx --configuration $(BuildConfiguration) --no-restore
    displayName: Build

  - script: dotnet test Avalonia.RemoteControl.slnx --configuration $(BuildConfiguration) --no-build --logger trx
    displayName: Test

  - script: dotnet pack Avalonia.RemoteControl.slnx --configuration $(BuildConfiguration) --no-build --output $(Build.ArtifactStagingDirectory)/packages
    displayName: Pack

  - task: PublishBuildArtifacts@1
    displayName: Publish package artifacts
    inputs:
      PathtoPublish: $(Build.ArtifactStagingDirectory)/packages
      ArtifactName: nuget-packages

  - task: PowerShell@2
    displayName: Publish tagged packages
    condition: and(succeeded(), startsWith(variables['Build.SourceBranch'], 'refs/tags/'))
    env:
      NUGET_API_KEY: $(NuGetApiKey)
    inputs:
      pwsh: true
      targetType: inline
      script: |
        if ([string]::IsNullOrWhiteSpace($env:NUGET_API_KEY)) {
          Write-Host "NuGetApiKey not set; skipping nuget.org publish."
          exit 0
        }

        $tag = "$(Build.SourceBranch)" -replace '^refs/tags/', ''
        if ($tag -notmatch '^v?\d+\.\d+\.\d+([.-][0-9A-Za-z][0-9A-Za-z.-]*)?$') {
          Write-Host "Tag '$tag' is not a version tag; skipping nuget.org publish."
          exit 0
        }

        if ($tag -match '-') {
          throw "Tag '$tag' is a prerelease tag. Full release publish requires a stable version tag like v1.2.3."
        }

        $expectedVersion = $tag -replace '^v', ''
        $packagePrefixes = @(
          'SharpNinja.Avalonia.RemoteControl.Protocol.',
          'SharpNinja.Avalonia.RemoteControl.Runtime.',
          'SharpNinja.Avalonia.RemoteControl.Server.',
          'SharpNinja.Avalonia.RemoteControl.Tool.'
        )

        $packages = Get-ChildItem -Path "$(Build.ArtifactStagingDirectory)/packages" |
          Where-Object { $_.Extension -eq '.nupkg' } |
          Select-Object -ExpandProperty FullName
        foreach ($package in $packages) {
          $packageName = Split-Path -Leaf $package
          $baseName = [System.IO.Path]::GetFileNameWithoutExtension($packageName)
          $packageVersion = $null
          foreach ($prefix in $packagePrefixes) {
            if ($baseName.StartsWith($prefix, [System.StringComparison]::Ordinal)) {
              $packageVersion = $baseName.Substring($prefix.Length)
              break
            }
          }

          if ([string]::IsNullOrWhiteSpace($packageVersion)) {
            throw "Could not parse package version from $packageName."
          }

          if ($packageVersion -ne $expectedVersion) {
            throw "Version tag '$tag' produced $packageName version '$packageVersion'; expected '$expectedVersion'."
          }

          dotnet nuget push $package --source https://api.nuget.org/v3/index.json --api-key $env:NUGET_API_KEY --skip-duplicate
          if ($LASTEXITCODE -ne 0) {
            throw "dotnet nuget push failed for $package"
          }
        }
